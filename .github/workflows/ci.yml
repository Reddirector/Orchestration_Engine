name: CI

on:
  push:
    branches: ["main", "stages-*"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff check
        run: uv run ruff check

  typecheck:
    name: Type Check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run tests with coverage
        run: uv run pytest --cov=orchestration_engine --cov-fail-under=90 -v

  smoke:
    name: Build & Install Wheel Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build wheel
        run: uv build
      - name: Smoke test installed wheel
        run: |
          uv venv /tmp/smoke-venv
          WHEEL=$(ls dist/*.whl | head -n 1)
          uv pip install --python /tmp/smoke-venv/bin/python "$WHEEL"
          /tmp/smoke-venv/bin/python -c "
          import orchestration_engine as oe
          for name in oe.__all__:
              assert hasattr(oe, name), f'Missing {name}'
          print('All exports successfully imported from wheel')
          "
          /tmp/smoke-venv/bin/python examples/run_simple_workflow.py
