site_name: Orchestration Engine
site_description: A fault-tolerant, dependency-aware workflow orchestration engine for Python.
site_author: Reddirector
repo_url: https://github.com/Reddirector/Orchestration_Engine
repo_name: Reddirector/Orchestration_Engine

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Installation: install.md
  - Quickstart: quickstart.md
  - Use Cases: use-cases.md
  - Core Concepts: concepts.md
  - Architecture: architecture.md
  - API Reference: api.md
  - CLI Reference: cli.md
  - Performance & Benchmarks: performance.md
  - FAQ: faq.md
  - Limitations: limitations.md
  - Project Policy: policy.md
  - Architecture Decisions:
      - "ADR 001: Thread Pool Timeouts": decisions/001-thread-pool-non-blocking-timeouts.md
      - "ADR 002: Exception Retries": decisions/002-exception-retry-and-last-error.md
      - "ADR 003: Error Hierarchy": decisions/003-error-hierarchy.md
      - "ADR 004: Schema v1": decisions/004-schema-v1-and-runs-table.md
      - "ADR 005: Run Model": decisions/005-run-model-and-lifecycle.md
      - "ADR 006: Resume Semantics": decisions/006-resume-semantics.md
      - "ADR 007: Task Representation": decisions/007-task-vs-taskrun-representation.md
      - "ADR 008: Concurrency": decisions/008-single-writer-coordinator-concurrency.md
      - "ADR 009: Data Flow": decisions/009-data-flow-and-task-outputs.md
      - "ADR 010: Lifecycle Hooks": decisions/010-hooks-lifecycle.md
      - "ADR 011: Workflow Builder": decisions/011-workflow-builder-and-serializer.md
      - "ADR 012: JSON Schema": decisions/012-json-schema-and-error-collection.md
      - "ADR 013: YAML Support": decisions/013-optional-yaml-support.md
      - "ADR 014: CLI Architecture": decisions/014-cli-and-structured-logging.md
  - Quality Reports:
      - "Baseline Report": reports/baseline.md
      - "Stage 2 Report": reports/stage-2-report.md
      - "Stage 3 Report": reports/stage-3-report.md
      - "Stage 4 Report": reports/stage-4-report.md
      - "Stage 5 Report": reports/stage-5-report.md
      - "Stage 6 Report": reports/stage-6-report.md
      - "Security Review": reports/security-review.md
      - "Final Verification": reports/final-verification.md
      - "Final Release Report": reports/FINAL-REPORT.md
