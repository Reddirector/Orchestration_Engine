[project]
name = "orchestration-engine"
version = "0.9.0"
description = "A fault-tolerant workflow orchestration engine"
readme = "README.md"
authors = [
    { name = "Aditya Kumar", email = "adityakumarks2008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT"]
keywords = [
    "workflow",
    "orchestration",
    "dag",
    "scheduler",
    "pipeline",
    "agent",
    "retry",
    "task",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Reddirector/Orchestration_Engine"
Repository = "https://github.com/Reddirector/Orchestration_Engine"
Issues = "https://github.com/Reddirector/Orchestration_Engine/issues"
Changelog = "https://github.com/Reddirector/Orchestration_Engine/blob/main/CHANGELOG.md"
Documentation = "https://reddirector.github.io/Orchestration_Engine/"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
orchestration-engine = "orchestration_engine.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
